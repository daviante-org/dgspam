{{- $needInternalPgSecret := and .Values.database.internal.enabled (empty .Values.database.internal.existingSecret) -}}
{{- $needExternalDbUrl := and (not .Values.database.internal.enabled) (empty .Values.database.external.existingSecret) -}}
{{- $needAbusechSecret := and (not (empty .Values.config.abusechAuthKey)) (empty .Values.config.abusechExistingSecret) -}}
{{- if or $needInternalPgSecret $needExternalDbUrl $needAbusechSecret }}
{{- $secretName := include "dgspamguard.fullname" . -}}
{{- $existingObj := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $existingData := dict -}}
{{- if $existingObj }}
  {{- $existingData = $existingObj.data -}}
{{- end }}
{{- $pgPassword := .Values.database.internal.password -}}
{{- if and (empty $pgPassword) (hasKey $existingData "postgres-password") }}
  {{- $pgPassword = (index $existingData "postgres-password" | b64dec) -}}
{{- end }}
{{- if empty $pgPassword }}
  {{- $pgPassword = randAlphaNum 32 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "dgspamguard.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needInternalPgSecret }}
  postgres-password: {{ $pgPassword | b64enc | quote }}
  {{- $pgHost := include "dgspamguard.postgresql.fullname" . }}
  {{- $dbUrl := printf "postgresql://%s:%s@%s:5432/%s?sslmode=disable" .Values.database.internal.username ($pgPassword | urlquery) $pgHost .Values.database.internal.database }}
  database-url: {{ $dbUrl | b64enc | quote }}
  {{- end }}
  {{- if $needExternalDbUrl }}
  {{- $extUrl := required "Set `database.external.url` or `database.external.existingSecret` when `database.internal.enabled=false`." .Values.database.external.url }}
  database-url: {{ $extUrl | b64enc | quote }}
  {{- end }}
  {{- if $needAbusechSecret }}
  abusech-auth-key: {{ .Values.config.abusechAuthKey | b64enc | quote }}
  {{- end }}
{{- end }}
