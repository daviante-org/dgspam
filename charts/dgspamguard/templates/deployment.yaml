apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dgspamguard.fullname" . }}
  labels:
    {{- include "dgspamguard.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dgspamguard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "dgspamguard.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dgspamguard.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- include "dgspamguard.podSecurityContext" . | nindent 8 }}
      containers:
        - name: dgspamguard
          securityContext:
            {{- include "dgspamguard.containerSecurityContext" . | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            {{- if and .Values.database.internal.enabled .Values.database.internal.existingSecret }}
            - name: DGSPAMGUARD_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.internal.existingSecret }}
                  key: {{ .Values.database.internal.existingSecretPasswordKey }}
            - name: DGSPAMGUARD_DATABASE_URL
              value: {{ printf "postgresql://%s:$(DGSPAMGUARD_PG_PASSWORD)@%s:5432/%s?sslmode=disable" .Values.database.internal.username (include "dgspamguard.postgresql.fullname" .) .Values.database.internal.database | quote }}
            {{- else }}
            - name: DGSPAMGUARD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dgspamguard.dbUrlSecretName" . }}
                  key: {{ include "dgspamguard.dbUrlSecretKey" . }}
            {{- end }}
            - name: DGSPAMGUARD_SWAGGER_ENABLED
              value: {{ .Values.swagger.enabled | quote }}
            - name: DGSPAMGUARD_DB_POOL_MIN_SIZE
              value: {{ .Values.config.dbPoolMinSize | quote }}
            - name: DGSPAMGUARD_DB_POOL_MAX_SIZE
              value: {{ .Values.config.dbPoolMaxSize | quote }}
            - name: DGSPAMGUARD_BOOTSTRAP_ON_STARTUP
              value: {{ .Values.config.bootstrapOnStartup | quote }}
            - name: DGSPAMGUARD_BOOTSTRAP_BUNDLE_URL
              value: {{ .Values.config.bootstrapBundleUrl | quote }}
            - name: DGSPAMGUARD_SYNC_SCHEDULER_ENABLED
              value: {{ .Values.config.syncSchedulerEnabled | quote }}
            - name: DGSPAMGUARD_SYNC_INTERVAL_SECONDS
              value: {{ .Values.config.syncIntervalSeconds | quote }}
            - name: DGSPAMGUARD_SNAPSHOT_INTERVAL_SECONDS
              value: {{ .Values.config.snapshotIntervalSeconds | quote }}
            - name: DGSPAMGUARD_RETENTION_DAYS
              value: {{ .Values.config.retentionDays | quote }}
            {{- if or .Values.config.abusechExistingSecret .Values.config.abusechAuthKey }}
            - name: DGSPAMGUARD_ABUSECH_AUTH_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.config.abusechExistingSecret }}{{ .Values.config.abusechExistingSecret }}{{ else }}{{ include "dgspamguard.fullname" . }}{{ end }}
                  key: {{ if .Values.config.abusechExistingSecret }}{{ .Values.config.abusechExistingSecretKey }}{{ else }}"abusech-auth-key"{{ end }}
            {{- end }}
            - name: DGSPAMGUARD_CACHE_DIR
              value: "/tmp/dgspamguard-cache"
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            {{- if .Values.tmpVolume.medium }}
            medium: {{ .Values.tmpVolume.medium | quote }}
            {{- end }}
            {{- if .Values.tmpVolume.sizeLimit }}
            sizeLimit: {{ .Values.tmpVolume.sizeLimit | quote }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
