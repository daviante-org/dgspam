{{- if .Values.database.internal.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dgspamguard.postgresql.fullname" . }}
  labels:
    {{- include "dgspamguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "dgspamguard.postgresql.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "dgspamguard.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dgspamguard.postgresql.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: "{{ .Values.database.internal.image.repository }}:{{ .Values.database.internal.image.tag }}"
          imagePullPolicy: {{ .Values.database.internal.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.internal.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.internal.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "dgspamguard.fullname" .) .Values.database.internal.existingSecret }}
                  key: {{ if .Values.database.internal.existingSecret }}{{ .Values.database.internal.existingSecretPasswordKey }}{{ else }}postgres-password{{ end }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.database.internal.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run-postgresql
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run-postgresql
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.database.internal.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.database.internal.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.database.internal.persistence.accessModes | nindent 10 }}
        {{- if .Values.database.internal.persistence.storageClassName }}
        storageClassName: {{ .Values.database.internal.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.internal.persistence.size }}
  {{- end }}
{{- end }}
