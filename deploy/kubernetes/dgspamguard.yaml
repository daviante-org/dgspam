# ==============================================================================
# DGSPAMGUARD Standalone Kubernetes Manifest (`restricted` Pod Security Standard)
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: dgspamguard
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dgspamguard
  namespace: dgspamguard
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dgspamguard
  namespace: dgspamguard
  labels:
    app.kubernetes.io/name: dgspamguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dgspamguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dgspamguard
    spec:
      serviceAccountName: dgspamguard
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dgspamguard
          image: ghcr.io/daviante-org/dgspamguard:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8091
              protocol: TCP
          env:
            - name: DGSPAMGUARD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dgspamguard-db
                  key: database-url
            - name: DGSPAMGUARD_CACHE_DIR
              value: /tmp/dgspamguard-cache
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dgspamguard
  namespace: dgspamguard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8091
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: dgspamguard
